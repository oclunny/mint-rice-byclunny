
print_info() {
  prin
  prin
  # info "${cl1} --- ■" distro      
    info "${cl1} --- ■" uptime
    info "${cl2} --- ■" shell    
    info "${cl3} --- ■" resolution
    info "${cl4} --- ■" de
    info "${cl5} --- ■" wm_theme
    info "${cl6} --- ■" icons
    prin "$(color 3) └──□──$(color 1)──□──$(color 3)──□──$(color 1)──□──$(color 3)──□──$(color 1)──□──$(color 3)──□──"
  prin
  prin


}

# Text Colors
reset="\033[0m"
red="\033[1;31m"
green="\033[1;32m"
yellow="\033[1;33m"
blue="\033[1;34m"
magenta="\033[1;35m"
cyan="\033[1;36m"
white="\033[1;37m"

cl0="${reset}"
cl1="${red}"
cl2="${green}"
cl3="${yellow}"
cl4="${blue}"
cl5="${magenta}"
cl6="${cyan}"
cl7="${white}"

# Hide/Show Fully qualified domain name
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="on"

# Uptime
uptime_shorthand="on"

# Memory
memory_percent="on"
memory_unit="mib"

# Packages
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# Resolution
refresh_rate="off"

# GTK Theme / Icons / Font
gtk_shorthand="off"
gtk2="on"
gtk3="on"


# Desktop Environment
de_version="on"

# Disk
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"


# Text Colors
colors=(1 6 3 1 8 3)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# Color Blocks (disabled)
color_blocks="off"

# Progress Bars
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"

cpu_display="off"
memory_display="info"
battery_display="off"
disk_display="off"

# Backend Settings
image_backend="off"
image_source="auto"

# Ascii Options
ascii_distro=""
ascii_colors=(distro)
ascii_bold="on"

# Image Options
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0
background_color=

# Misc Options
stdout="off"


